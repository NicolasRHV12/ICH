<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barra de Cocteles - App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- PANTALLA DE CARGA (LOADER) -->
    <div id="loader-wrapper">
        <div class="loader-content">
            <div class="loader-image-container" id="imageSlider">
                <!-- Imágenes de ejemplo para la transición del loader -->
                <img src="https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?auto=format&fit=crop&w=500&q=80" class="active" alt="Cóctel 1">
                <img src="https://images.unsplash.com/photo-1551024709-8f23befc6f87?auto=format&fit=crop&w=500&q=80" alt="Cóctel 2">
                <img src="https://images.unsplash.com/photo-1536935338788-846bb9981813?auto=format&fit=crop&w=500&q=80" alt="Cóctel 3">
                <img src="https://images.unsplash.com/photo-1527661591475-527312dd65f5?auto=format&fit=crop&w=500&q=80" alt="Cóctel 4">
            </div>
        </div>
        <div class="loader-counter" id="counter">0%</div>
    </div>

    <!-- CONTENIDO PRINCIPAL DE LA PÁGINA -->
    <div id="main-content">
        <h1>Bienvenido a mi App de Coctelería 🍸</h1>
        <p>El sistema se ha cargado correctamente. Aquí podrás diseñar y calcular tus recetas.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
