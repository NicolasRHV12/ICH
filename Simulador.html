<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Geometric Aura · Modern Visual</title>
    <style>
        html, body {
            margin: 0;
            overflow: hidden;
            font-family: Inter, Segoe UI, PingFang SC, Roboto, Helvetica Neue, sans-serif;
            background-color: #050811;
        }
        body:before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(10,20,40,.8), rgba(0,0,0,.95));
            z-index: -2;
        }
        body:after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
            z-index: -1;
            pointer-events: none;
        }
        .info {
            position: absolute;
            bottom: 24px;
            left: 0; right: 0;
            text-align: center;
            color: hsla(0,0%,100%,.7);
            font-size: 14px;
            letter-spacing: 1px;
            font-weight: 400;
            backdrop-filter: blur(8px);
            background: rgba(0,0,0,.3);
            width: fit-content;
            margin: 0 auto;
            padding: 8px 20px;
            border-radius: 40px;
            z-index: 10;
            font-family: monospace;
            border: 1px solid hsla(0,0%,100%,.15);
            pointer-events: none;
        }
        .info a {
            color: #8cf;
            text-decoration: none;
            pointer-events: auto;
            transition: color .3s;
        }
        .info a:hover {
            color: #fff;
            text-decoration: underline;
        }
        @media (max-width:600px) {
            .info { font-size: 10px; bottom: 16px; padding: 6px 16px; }
        }
        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%,-50%);
            color: #fff;
            font-family: monospace;
            background: rgba(0,0,0,.6);
            padding: 12px 24px;
            border-radius: 30px;
            z-index: 100;
            backdrop-filter: blur(5px);
            transition: opacity 1s;
            pointer-events: none;
        }
    </style>
</head>
<body>

  <div class="info">
    ✦ 3D Geometric Aura ✦ | <span style="color:#88ccff">Drag to rotate view</span> | Inspired Iteration · Refreshed Presentation
  </div>
  
  <div id="loading">Loading visual engine...</div>

  <!-- Script principal de Three.js modular ejecutado en el navegador -->
  <script type="module">
    import * as THREE from "https://esm.sh/three";
    import { OrbitControls } from "https://esm.sh/three/addons/controls/OrbitControls.js";
    import { EffectComposer } from "https://esm.sh/three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "https://esm.sh/three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "https://esm.sh/three/addons/postprocessing/UnrealBloomPass.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x330522);
    scene.fog = new THREE.FogExp2(0x330522, .008);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, .1, 1000);
    camera.position.set(3, 2, 5);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ReinhardToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    const renderScene = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, .3, .85);
    bloomPass.threshold = .1;
    bloomPass.strength = .8;
    bloomPass.radius = .5;

    const effectComposer = new EffectComposer(renderer);
    effectComposer.addPass(renderScene);
    effectComposer.addPass(bloomPass);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = .05;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.2;
    controls.enableZoom = true;
    controls.enablePan = false;
    controls.zoomSpeed = 1;
    controls.rotateSpeed = 1;
    controls.target.set(0, 0, 0);

    const ambientLight = new THREE.AmbientLight(0x2236962);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
    mainLight.position.set(2, 3, 4);
    scene.add(mainLight);

    const backLight = new THREE.PointLight(0x4482764, .6);
    backLight.position.set(-2, 1, -3);
    scene.add(backLight);

    const fillLight = new THREE.PointLight(0xff5536, .5);
    fillLight.position.set(1.5, 1, 2);
    scene.add(fillLight);

    const colorLight = new THREE.PointLight(0xff292a, .8);
    colorLight.position.set(1, 1, 2);
    scene.add(colorLight);

    // Estrellas de fondo
    const starGeometry = new THREE.BufferGeometry();
    const starPositions = new Float32Array(2400);
    for (let e = 0; e < 800; e++) {
        starPositions[3 * e] = 200 * (Math.random() - .5);
        starPositions[3 * e + 1] = 100 * (Math.random() - .5);
        starPositions[3 * e + 2] = 80 * (Math.random() - .5) - 40;
    }
    starGeometry.setAttribute("position", new THREE.BufferAttribute(starPositions, 3));
    const starMaterial = new THREE.PointsMaterial({ color: 0xaa9f7f, size: .08, transparent: true, opacity: .6 });
    const stars = new THREE.Points(starGeometry, starMaterial);
    scene.add(stars);

    // Malla principal (Icosaedro)
    const geometryIco = new THREE.IcosahedronGeometry(1.1, 0);
    const materialMain = new THREE.MeshStandardMaterial({
        color: 0x4a77cc, emissive: 0xab222b, roughness: .28,
        metalness: .75, flatShading: false, transparent: true, opacity: .92
    });
    const coreMesh = new THREE.Mesh(geometryIco, materialMain);
    scene.add(coreMesh);

    const wireframeMat = new THREE.MeshBasicMaterial({ color: 0x66ccff, wireframe: true, transparent: true, opacity: .25 });
    const wireframeIco = new THREE.Mesh(geometryIco, wireframeMat);
    wireframeIco.scale.setScalar(1.08);
    scene.add(wireframeIco);

    // Partículas de anillo
    const ringParticleCount = 1200;
    const ringGeometry = new THREE.BufferGeometry();
    const ringPositions = new Float32Array(3600);
    const ringColors = new Float32Array(3600);
    for (let e = 0; e < 1200; e++) {
        const t = e / 1200 * Math.PI * 2;
        const o = 1.55;
        const n = Math.cos(t) * o;
        const r = Math.sin(t) * o;
        const i = .35 * Math.sin(3 * t);
        ringPositions[3 * e] = n;
        ringPositions[3 * e + 1] = i;
        ringPositions[3 * e + 2] = r;
        ringColors[3 * e] = .4 + .6 * Math.sin(t);
        ringColors[3 * e + 1] = .3 + .7 * Math.cos(1.7 * t);
        ringColors[3 * e + 2] = .8 + .2 * Math.sin(2.3 * t);
    }
    ringGeometry.setAttribute("position", new THREE.BufferAttribute(ringPositions, 3));
    ringGeometry.setAttribute("color", new THREE.BufferAttribute(ringColors, 3));
    const ringMaterial = new THREE.PointsMaterial({ size: .05, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending });
    const ringParticles = new THREE.Points(ringGeometry, ringMaterial);
    scene.add(ringParticles);

    // Anillos Torus
    const torusMat = new THREE.MeshStandardMaterial({ color: 0x8899ff, emissive: 0x2266aa, roughness: .3, metalness: .9 });
    const torusRing = new THREE.Mesh(new THREE.TorusGeometry(1.45, .045, 64, 500), torusMat);
    scene.add(torusRing);

    const torusRing2 = new THREE.Mesh(new THREE.TorusGeometry(1.68, .03, 64, 500), torusMat);
    torusRing2.material = new THREE.MeshStandardMaterial({ color: 0xffaa44, emissive: 0x443322, roughness: .5, metalness: .7 });
    scene.add(torusRing2);

    // Nube de partículas central
    const cloudGeo = new THREE.BufferGeometry();
    const cloudPositions = new Float32Array(2400);
    for (let e = 0; e < 800; e++) {
        cloudPositions[3 * e] = 5 * (Math.random() - .5);
        cloudPositions[3 * e + 1] = 3 * (Math.random() - .5);
        cloudPositions[3 * e + 2] = 4 * (Math.random() - .5) - 1;
    }
    cloudGeo.setAttribute("position", new THREE.BufferAttribute(cloudPositions, 3));
    const cloudMat = new THREE.PointsMaterial({ color: 0x7788ff, size: .025, transparent: true, opacity: .4, blending: THREE.AdditiveBlending });
    const cloudPoints = new THREE.Points(cloudGeo, cloudMat);
    scene.add(cloudPoints);

    const gridHelper = new THREE.GridHelper(12, 24, 0x8899ff, 0x334466);
    gridHelper.position.y = -1.8;
    gridHelper.material.transparent = true;
    gridHelper.material.opacity = .2;
    scene.add(gridHelper);

    // Ocultar pantalla de carga
    setTimeout(() => {
        const loader = document.getElementById("loading");
        if (loader) {
            loader.style.opacity = "0";
            setTimeout(() => loader.remove(), 1000);
        }
    }, 500);

    let time = 0;
    function animate() {
        requestAnimationFrame(animate);
        time += .012;
        coreMesh.rotation.y = .25 * time;
        coreMesh.rotation.x = .2 * Math.sin(.37 * time);
        coreMesh.rotation.z = .15 * Math.cos(.23 * time);
        wireframeIco.rotation.copy(coreMesh.rotation);
        ringParticles.rotation.y = .35 * time;
        ringParticles.rotation.x = .2 * Math.sin(.28 * time);
        torusRing.rotation.x = Math.PI / 2;
        torusRing.rotation.z = .5 * time;
        torusRing2.rotation.x = Math.PI / 2 + .3;
        torusRing2.rotation.z = .65 * time;
        
        const e = .2 * time % (2 * Math.PI);
        colorLight.color.setHSL(.55 + .1 * Math.sin(e), 1, .6);
        stars.rotation.y += 5e-4;
        stars.rotation.x += 3e-4;
        cloudPoints.rotation.y = .05 * time;
        cloudPoints.rotation.x = .1 * Math.sin(.1 * time);
        
        controls.update();
        effectComposer.render();
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        effectComposer.setSize(window.innerWidth, window.innerHeight);
    }

    animate();
    window.addEventListener("resize", onWindowResize, false);
  </script>
</body>
</html>
